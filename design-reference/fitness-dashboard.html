<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>NŪRA — Fitness</title>
<style>
  :root{--bg:#0d0d0e;--sage:#9bb0a5;--sage2:#abc0b5;--text:#ebe6d8;--mut:rgba(235,230,216,.5);--surf:rgba(235,230,216,.045);--line:rgba(235,230,216,.09);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;color:var(--text);}
  .wrap{min-height:100vh;display:flex;justify-content:center;padding:20px;background:radial-gradient(120% 40% at 50% -5%, #16191780 0%, #0d0d0e 50%);}
  .app{width:100%;max-width:440px;padding-bottom:90px;}
  /* header */
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .top .eye{font-size:11px;letter-spacing:.22em;color:var(--mut);}
  .top h1{font-size:26px;font-weight:700;letter-spacing:-.01em;margin:3px 0 0;}
  .pro{display:flex;align-items:center;gap:6px;background:rgba(155,176,165,.14);border:1px solid rgba(155,176,165,.3);color:var(--sage);font-size:11px;font-weight:700;letter-spacing:.08em;padding:7px 12px;border-radius:999px;}
  /* segmented toggle */
  .seg{display:flex;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px;}
  .seg button{flex:1;border:none;background:transparent;color:var(--mut);font-size:13px;font-weight:600;padding:9px;border-radius:9px;cursor:pointer;transition:.18s;}
  .seg button.on{background:var(--sage);color:var(--bg);}
  /* week strip */
  .week{display:flex;gap:7px;margin-bottom:22px;}
  .wd{flex:1;text-align:center;padding:11px 0 9px;border-radius:14px;background:var(--surf);border:1px solid var(--line);cursor:pointer;transition:.16s;}
  .wd .dow{font-size:10px;letter-spacing:.05em;color:var(--mut);}
  .wd .num{font-size:16px;font-weight:700;margin-top:5px;}
  .wd .dot{width:5px;height:5px;border-radius:50%;margin:6px auto 0;background:transparent;}
  .wd.train .dot{background:var(--sage);}
  .wd.today{background:var(--sage);border-color:var(--sage);box-shadow:0 8px 22px rgba(155,176,165,.28);}
  .wd.today .dow,.wd.today .num{color:var(--bg);}
  .wd.today .dot{background:var(--bg);}
  /* month grid */
  .month{display:none;background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:22px;}
  .mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .mhead .mt{font-size:15px;font-weight:700;}
  .mhead .nav{color:var(--mut);font-size:13px;}
  .mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .mgrid .mdow{font-size:10px;color:var(--mut);text-align:center;padding-bottom:6px;}
  .mc{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;border-radius:10px;color:rgba(235,230,216,.8);position:relative;}
  .mc.empty{color:transparent;}
  .mc.train{background:rgba(155,176,165,.16);color:var(--text);font-weight:600;}
  .mc.train::after{content:"";position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--sage);}
  .mc.today{background:var(--sage);color:var(--bg);font-weight:700;}
  /* today hero card */
  .hero{position:relative;overflow:hidden;border-radius:22px;padding:20px;margin-bottom:14px;background:linear-gradient(135deg,rgba(155,176,165,.20),rgba(155,176,165,.04));border:1px solid rgba(155,176,165,.25);}
  .hero .glow{position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(155,176,165,.35),transparent 70%);pointer-events:none;}
  .hero .motif{position:absolute;right:-10px;bottom:-30px;opacity:.13;}
  .hero .eye{font-size:11px;letter-spacing:.16em;color:var(--sage);}
  .hero h2{font-size:24px;font-weight:700;margin:6px 0 4px;}
  .hero .meta{font-size:13px;color:var(--mut);}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 16px;}
  .chip{font-size:11px;background:rgba(13,13,14,.35);border:1px solid rgba(235,230,216,.12);color:var(--text);border-radius:999px;padding:5px 11px;}
  .hrow{display:flex;gap:10px;align-items:center;position:relative;z-index:2;}
  .start{flex:1;background:var(--sage);color:var(--bg);border:none;border-radius:13px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(155,176,165,.3);}
  .iconbtn{width:48px;height:48px;border-radius:13px;background:rgba(13,13,14,.4);border:1px solid rgba(235,230,216,.14);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  /* edit list */
  .editcard{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:6px 16px 14px;margin-bottom:22px;}
  .editcard .eh{display:flex;justify-content:space-between;align-items:center;padding:14px 0 6px;}
  .editcard .eh .t{font-size:13px;letter-spacing:.04em;color:var(--mut);}
  .ex{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid rgba(235,230,216,.06);}
  .ex .grip{color:rgba(235,230,216,.25);}
  .ex .tb{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,rgba(155,176,165,.22),rgba(155,176,165,.05));border:1px solid rgba(155,176,165,.2);display:flex;align-items:center;justify-content:center;color:var(--sage);font-size:11px;flex-shrink:0;}
  .ex .info{flex:1;min-width:0;}
  .ex .nm{font-size:14px;font-weight:600;}
  .ex .mu{font-size:11px;color:var(--mut);margin-top:2px;}
  .stepper{display:flex;align-items:center;gap:7px;}
  .stepper button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:rgba(235,230,216,.05);color:var(--text);font-size:15px;cursor:pointer;line-height:1;}
  .stepper .v{font-size:13px;font-weight:700;min-width:42px;text-align:center;}
  .stepper .lab{font-size:9px;color:var(--mut);display:block;text-align:center;letter-spacing:.05em;}
  .addex{width:100%;margin-top:10px;background:transparent;border:1px dashed rgba(155,176,165,.4);color:var(--sage);border-radius:12px;padding:12px;font-size:13px;font-weight:600;cursor:pointer;}
  /* programs */
  .sec{font-size:12px;letter-spacing:.16em;color:var(--mut);text-transform:uppercase;margin:4px 0 12px;}
  .prog{display:flex;align-items:center;gap:14px;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;}
  .prog .pic{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,rgba(155,176,165,.25),rgba(155,176,165,.06));border:1px solid rgba(155,176,165,.2);flex-shrink:0;}
  .prog .pi{flex:1;}
  .prog .pn{font-size:14.5px;font-weight:700;}
  .bar{height:6px;border-radius:6px;background:rgba(235,230,216,.1);margin-top:8px;overflow:hidden;}
  .bar i{display:block;height:100%;background:var(--sage);border-radius:6px;}
  .prog .pct{font-size:13px;font-weight:700;color:var(--sage);}
  /* bottom nav */
  .nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:calc(100% - 40px);max-width:400px;background:rgba(20,22,21,.9);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:20px;display:flex;justify-content:space-around;padding:12px;}
  .nav .n{color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;}
  .nav .n.on{color:var(--sage);}
  .nav .n svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
</style></head>
<body><div class="wrap"><div class="app">

  <div class="top">
    <div><div class="eye">FITNESS</div><h1>Your week</h1></div>
    <div class="pro">★ PRO</div>
  </div>

  <div class="seg">
    <button class="on" data-v="week">Week</button>
    <button data-v="month">Month</button>
  </div>

  <!-- WEEK -->
  <div class="week" id="weekStrip">
    <div class="wd train"><div class="dow">MON</div><div class="num">15</div><div class="dot"></div></div>
    <div class="wd today"><div class="dow">TUE</div><div class="num">16</div><div class="dot"></div></div>
    <div class="wd"><div class="dow">WED</div><div class="num">17</div><div class="dot"></div></div>
    <div class="wd train"><div class="dow">THU</div><div class="num">18</div><div class="dot"></div></div>
    <div class="wd"><div class="dow">FRI</div><div class="num">19</div><div class="dot"></div></div>
    <div class="wd train"><div class="dow">SAT</div><div class="num">20</div><div class="dot"></div></div>
    <div class="wd"><div class="dow">SUN</div><div class="num">21</div><div class="dot"></div></div>
  </div>

  <!-- MONTH -->
  <div class="month" id="monthView">
    <div class="mhead"><span class="mt">June 2026</span><span class="nav">‹   ›</span></div>
    <div class="mgrid" id="mgrid"></div>
  </div>

  <!-- TODAY HERO -->
  <div class="hero">
    <div class="glow"></div>
    <svg class="motif" width="150" height="150" viewBox="0 0 24 24" fill="none" stroke="#9bb0a5" stroke-width="1.2"><path d="M6.5 6.5 17.5 17.5M3 8l3-3M16 21l3-3M8 3 5 6M21 16l-3 3"/></svg>
    <div class="eye">TODAY · TUESDAY</div>
    <h2>Full Body</h2>
    <div class="meta">5 exercises · ~45 min</div>
    <div class="chips"><span class="chip">Chest</span><span class="chip">Back</span><span class="chip">Legs</span><span class="chip">Shoulders</span><span class="chip">Core</span></div>
    <div class="hrow">
      <button class="start">Start workout</button>
      <button class="iconbtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
    </div>
  </div>

  <!-- SIMPLE EDIT -->
  <div class="editcard">
    <div class="eh"><span class="t">EDIT TODAY'S WORKOUT</span><span class="t" style="color:var(--sage)">auto-saves</span></div>
    <div id="exlist"></div>
    <button class="addex">+ Add exercise</button>
  </div>

  <!-- PROGRAMS -->
  <div class="sec">Continue</div>
  <div class="prog"><div class="pic"></div><div class="pi"><div class="pn">Full Body Builder</div><div class="bar"><i style="width:50%"></i></div></div><div class="pct">50%</div></div>
  <div class="prog"><div class="pic"></div><div class="pi"><div class="pn">Upper / Lower Split</div><div class="bar"><i style="width:32%"></i></div></div><div class="pct">32%</div></div>

  <div class="nav">
    <div class="n on"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Home</div>
    <div class="n"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Calendar</div>
    <div class="n"><svg viewBox="0 0 24 24"><path d="M3 3v18h18M7 14l3-3 3 3 5-5"/></svg>Progress</div>
    <div class="n"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profile</div>
  </div>

</div></div>
<script>
  const exs = [
    {n:'Barbell Squat', m:'Quads · Glutes', s:4, r:'8-12'},
    {n:'Bench Press', m:'Chest', s:4, r:'8-12'},
    {n:'Bent-over Row', m:'Back', s:4, r:'8-12'},
    {n:'Overhead Press', m:'Shoulders', s:3, r:'10-12'},
    {n:'Hanging Leg Raise', m:'Core', s:3, r:'12-15'}
  ];
  const list = document.getElementById('exlist');
  exs.forEach((e,i)=>{
    const row = document.createElement('div'); row.className='ex';
    row.innerHTML = `
      <span class="grip"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/></svg></span>
      <div class="tb">▶</div>
      <div class="info"><div class="nm">${e.n}</div><div class="mu">${e.m}</div></div>
      <div class="stepper"><button data-d="-1" data-i="${i}">−</button><div class="v"><span id="v${i}">${e.s} × ${e.r}</span><span class="lab">SETS×REPS</span></div><button data-d="1" data-i="${i}">+</button></div>`;
    list.appendChild(row);
  });
  document.querySelectorAll('.stepper button').forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.i, d=+b.dataset.d; exs[i].s=Math.max(1,Math.min(6,exs[i].s+d));
    document.getElementById('v'+i).textContent = exs[i].s+' × '+exs[i].r;
  }));
  document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('.seg button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    const month = b.dataset.v==='month';
    document.getElementById('monthView').style.display = month?'block':'none';
    document.getElementById('weekStrip').style.display = month?'none':'flex';
  }));
  const mg = document.getElementById('mgrid');
  ['S','M','T','W','T','F','S'].forEach(d=>{const e=document.createElement('div');e.className='mdow';e.textContent=d;mg.appendChild(e);});
  const firstDow = 1;
  for(let i=0;i<firstDow;i++){const e=document.createElement('div');e.className='mc empty';mg.appendChild(e);}
  for(let day=1; day<=30; day++){
    const e=document.createElement('div'); e.className='mc';
    const dow=(firstDow+day-1)%7;
    if([1,4,6].includes(dow)) e.classList.add('train');
    if(day===16) {e.className='mc today';}
    e.textContent=day; mg.appendChild(e);
  }
</script>
</body></html>
